# Прод-оркестрация Tracker: фронт + бэк + Postgres + edge-nginx + certbot.
# Запуск (из каталога tracker-deploy):
#   docker compose --env-file .env.prod -f docker-compose.prod.yml pull
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# Образы web/api больше не собираются на сервере: их собирает GitHub Actions и
# публикует в ghcr, сервер только скачивает готовые (см. .github/workflows/deploy.yml).
# Поэтому исходники приложений на сервере не нужны — git-репозиторий там нужен
# только ради самой инфраструктуры: этого файла и шаблонов nginx.

services:
  # PostgreSQL. Данные живут в именованном volume, переживают пересоздание контейнера.
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # api ждёт, пока база реально готова принимать подключения (см. depends_on ниже).
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Бэк (NestJS). При старте контейнер сам накатывает миграции (docker-entrypoint.sh).
  # Все секреты приложения приходят из .env.prod.
  api:
    # ${API_TAG:-latest} — «взять переменную API_TAG из окружения, а если её нет,
    # подставить latest». Обычный релиз идёт под latest; при откате workflow
    # передаёт сюда git-SHA нужного релиза (кнопка Run workflow, см. README).
    image: ghcr.io/ko1iya/budget-api:${API_TAG:-latest}
    restart: always
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000' # порт виден только внутри docker-сети, наружу его проксирует edge-nginx

  # Фронт (статика за внутренним nginx). Наружу не светится — только через edge-nginx.
  web:
    # VITE_API_URL переехал отсюда в build-args workflow: Vite инлайнит переменные
    # VITE_* в бандл на этапе сборки, а сборка теперь идёт в CI, не здесь.
    image: ghcr.io/ko1iya/budget-web:${WEB_TAG:-latest}
    restart: always
    expose:
      - '80'

  # Edge-nginx: единственная точка входа из интернета. Терминирует HTTPS,
  # проксирует / → web и /api/ → api. Конфиг генерится из шаблона: nginx-образ
  # при старте подставляет ${DUCKDNS_DOMAIN} через envsubst (templates → conf.d).
  proxy:
    image: nginx:alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    environment:
      DUCKDNS_DOMAIN: ${DUCKDNS_DOMAIN}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web
      - api

  # Certbot: раз в 12 часов пытается продлить сертификат Let's Encrypt.
  # Первичный выпуск делает scripts/init-letsencrypt.sh (см. README).
  certbot:
    image: certbot/certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
