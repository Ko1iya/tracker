# Внутренний nginx web-контейнера: отдаёт собранную статику фронта.
# HTTPS и проксирование /api делает внешний edge-nginx (см. tracker-deploy),
# сюда трафик приходит уже расшифрованным по внутренней docker-сети.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-fallback: любой путь, которого нет на диске, отдаёт index.html,
    # чтобы прямые заходы на /categories, /login и т.п. обрабатывал React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
