<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracker — AI Budget App</title>
    <!-- Применяем сохранённую тему до загрузки React, чтобы не мелькала
         светлая тема при тёмной (FOUC). Логика дублирует features/theme. -->
    <script>
      (function () {
        var t = localStorage.getItem("tracker-theme") || "system"
        var dark =
          t === "dark" ||
          (t === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
